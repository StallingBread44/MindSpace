<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MindSpace</title>
    <link rel="icon" href="../assets/mindspace-logo.PNG" type="image/png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body id="login">

<div class="login-wrapper">
    <div class="backbutton-wrapper">
        <button onclick="history.back()" class="back-btn">
            <img class="login-arrow" src="../assets/back-btn.svg">Back
        </button>
    </div>

    <div class="login-logo">
        <img id="login-logo" src="../assets/mindspace-logo.PNG">
    </div>

    <div class="info">
        <h1 id="wlcmsg">Welcome In!</h1>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <div class="text-fields">
        <div id="name">
            <input class="textbox" type="text" id="username-input" placeholder="Goonesh" maxlength="50">
        </div>
        <div id="email">
            <input class="textbox" type="text" id="email-input" placeholder="ramesh.kamineni@gmail.com" maxlength="50">
        </div>
        <div id="password">
            <input class="textbox" type="password" id="password-input" placeholder="Password" maxlength="50">
        </div>
    </div>

    <div class="login-direct">
        <button id="signup-btn">Sign Up</button>
    </div>

    <div id="msg" class="note"></div>
</div>

<script>
document.getElementById("signup-btn").onclick = async () => {
    const usernameEl = document.getElementById("username-input");
    const emailEl = document.getElementById("email-input");
    const passwordEl = document.getElementById("password-input");
    const msg = document.getElementById("msg");

    const username = usernameEl.value.trim();
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    if (!username || !email || !password) {
        msg.textContent = "All fields are required.";
        msg.style.color = "red";
        return;
    }

    try {
        const res = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();

        if (res.ok) {
            msg.textContent = "Account created! Redirecting to login...";
            msg.style.color = "green";
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        } else {
            msg.textContent = data.message || "Signup failed.";
            msg.style.color = "red";
        }
    } catch (err) {
        msg.textContent = "Network error. Try again.";
        msg.style.color = "red";
    }
};
</script>

</body>
</html>
